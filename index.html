<head>
    <meta charset="UTF-8">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<body>
  <header id="top">
    <h1>JNEC Events Hub</h1>

    <nav>
      <a href="index.html" title="Go to home page">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html">Register</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <div id="eventCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="media/banner1.jpg"
                 class="d-block w-100"
                 alt="Campus event banner 1">
        </div>

        <div class="carousel-item">
            <img src="media/banner2.jpg"
                 class="d-block w-100"
                 alt="Campus event banner 2">
        </div>

    </div>

    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#eventCarousel"
            data-bs-slide="prev">
        <span class="carousel-control-prev-icon"
              aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>

    <button class="carousel-control-next"
            type="button"
            data-bs-target="#eventCarousel"
            data-bs-slide="next">
        <span class="carousel-control-next-icon"
              aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>

</div>
    <div id="welcome" class="main-content">

        <h2>Welcome</h2>

        <p>This is the JNEC Events Hub.</p>

        <img src="Media/campus.jpg.png" alt="JNEC Campus">

        <p>
            <a href="register.html">Register now</a>
        </p>

        <!-- keep the rest of your Welcome content here -->

</main>
