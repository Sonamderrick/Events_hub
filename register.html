<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JNEC Events Hub - Register</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Existing CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header id="top">

    <h1>JNEC Events Hub</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Register</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>

</header>


<main>

<div class="container py-4">

    <h2 class="mb-4">
        <i class="fa-solid fa-user-plus"></i>
        Event Registration
    </h2>


    <form action="#" method="post"
          enctype="multipart/form-data"
          id="regForm">

        <!-- PERSONAL DETAILS -->
        <fieldset class="mb-4">

            <legend class="mb-3">
                Personal Details
            </legend>


            <div class="mb-3">

                <label for="fullname"
                       class="form-label">
                    Full Name
                </label>

                <input type="text"
                       class="form-control"
                       id="fullname"
                       name="fullname">

            </div>


            <div class="mb-3">

                <label for="email"
                       class="form-label">
                    Email
                </label>

                <input type="text"
                       class="form-control"
                       id="email"
                       name="email">

            </div>


            <div class="mb-3">

                <label for="phone"
                       class="form-label">
                    Phone
                </label>

                <input type="text"
                       class="form-control"
                       id="phone"
                       name="phone">

            </div>

        </fieldset>


        <!-- EVENT DETAILS -->
        <fieldset class="mb-4">

            <legend class="mb-3">
                Event Choice
            </legend>


            <div class="mb-3">

                <label for="event_id"
                       class="form-label">
                    Event
                </label>

                <select class="form-select"
                        id="event_id"
                        name="event_id">

                    <option value="">
                        -- Choose an event --
                    </option>

                    <option value="1">
                        Tech Week Hackathon
                    </option>

                    <option value="2">
                        Losar Festival Night
                    </option>

                    <option value="3">
                        Inter-College Football
                    </option>

                </select>

            </div>


            <p class="mb-2">
                Food preference:
            </p>


            <div class="form-check mb-2">

                <input class="form-check-input"
                       type="radio"
                       id="veg"
                       name="food"
                       value="veg">

                <label class="form-check-label"
                       for="veg">
                    Vegetarian
                </label>

            </div>


            <div class="form-check mb-3">

                <input class="form-check-input"
                       type="radio"
                       id="nonveg"
                       name="food"
                       value="nonveg">

                <label class="form-check-label"
                       for="nonveg">
                    Non-vegetarian
                </label>

            </div>


            <p class="mb-2">
                Interested in:
            </p>


            <div class="form-check mb-2">

                <input class="form-check-input"
                       type="checkbox"
                       id="volunteer"
                       name="interests"
                       value="volunteer">

                <label class="form-check-label"
                       for="volunteer">
                    Volunteering
                </label>

            </div>


            <div class="form-check mb-3">

                <input class="form-check-input"
                       type="checkbox"
                       id="perform"
                       name="interests"
                       value="perform">

                <label class="form-check-label"
                       for="perform">
                    Performing
                </label>

            </div>

        </fieldset>


        <!-- ADDITIONAL DETAILS -->
        <fieldset class="mb-4">

            <legend class="mb-3">
                Additional Details
            </legend>


            <div class="mb-3">

                <label for="department"
                       class="form-label">
                    Department
                </label>

                <select class="form-select"
                        id="department"
                        name="department">

                    <option value="">
                        -- Select Department --
                    </option>

                    <option value="information">
                        Information Technology
                    </option>

                    <option value="civil">
                        Civil
                    </option>

                    <option value="electrical">
                        Electrical
                    </option>

                </select>

            </div>


            <div class="mb-3">

                <label for="remarks"
                       class="form-label">
                    Remarks
                </label>

                <textarea class="form-control"
                          id="remarks"
                          name="remarks"
                          rows="4"></textarea>

            </div>


            <div class="mb-4">

                <label for="id_card"
                       class="form-label">
                    Student ID Card (image)
                </label>

                <input type="file"
                       class="form-control"
                       id="id_card"
                       name="id_card">

            </div>

        </fieldset>


        <!-- BUTTONS -->
        <button type="submit"
                class="btn btn-primary">
            Register
        </button>

        <button type="reset"
                class="btn btn-outline-secondary">
            Reset
        </button>

    </form>

</div>

</main>


<footer>

    <p>&copy; 2026 JNEC Events Hub</p>

</footer>


<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
