<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JNEC Events Hub - Register</title>
</head>
<body>
  <header id="top">
    <h1>JNEC Events Hub</h1>

    <nav>
      <a href="index.html" title="Go to home page">Home</a>
      <a href="events.html">Events</a>
      <a href="register.html">Register</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
<h2>Registration Form</h2>

<fieldset>
    <legend>Personal Details</legend>

    <label for="fullname">Full name:</label>
    <input type="text" id="fullname" name="fullname">

    <br><br>

   <label for="email">Email:</label>
<input type="email" id="email" name="email">

<br><br>

<label for="phone">Phone:</label>
<input type="text" id="phone" name="phone">

</fieldset>

<br><br>
<fieldset>
    <legend>Event Choice</legend>

    <label for="event_id">Event:</label>
    <select id="event_id" name="event_id">
        <option value="">-- Choose an event --</option>
        <option value="1">Tech Week Hackathon</option>
        <option value="2">Losar Festival Night</option>
        <option value="3">Inter-College Football</option>
    </select>
    <p>Food preference:</p>

<input type="radio" id="veg" name="food" value="veg">
<label for="veg">Vegetarian</label>

<input type="radio" id="nonveg" name="food" value="nonveg">
<label for="nonveg">Non-vegetarian</label>
<p>Interested in:</p>

<input type="checkbox" id="volunteer" name="interests" value="volunteer">
<label for="volunteer">Volunteering</label>

<input type="checkbox" id="perform" name="interests" value="perform">
<label for="perform">Performing</label>
<br><br>
<br><br>

<label for="photo">Upload Photo:</label>
<input type="file" id="photo" name="photo">

<br><br>

<fieldset>
    <label for="remarks">Remarks:</label>
    <textarea id="remarks" name="remarks" rows="4"></textarea>

    <label for="id_card">Student ID card (image)</label>
    <input type="file" id="id_card" name="id_card">
</fieldset>

<button type="submit">Register</button>
<button type="reset">Clear</button>




<br><br>
<fieldset>
    <legend>Participation</legend>

    <p>Choose your category:</p>

    <label>
        <input type="radio" name="category" value="student">
        Student
    </label>

    <label>
        <input type="radio" name="category" value="staff">
        Staff
    </label>

    <p>Select your interests:</p>

    <label>
        <input type="checkbox" name="interest" value="sports">
        Sports
    </label>

    <label>
        <input type="checkbox" name="interest" value="technology">
        Technology
    </label>

    <label>
        <input type="checkbox" name="interest" value="music">
        Music
    </label>
</fieldset>

<br>
<fieldset>
    <legend>Event Choice</legend>

    <label for="event">Choose Event:</label>
    <select id="event" name="event">
        <option value="hackathon">Hackathon</option>
        <option value="losar">Losar Night</option>
        <option value="football">Football</option>
    </select>

    <br><br>

    <p>Food:</p>

    <label>
        <input type="radio" name="food" value="veg">
        Vegetarian
    </label>

    <label>
        <input type="radio" name="food" value="nonveg">
        Non-Vegetarian
    </label>

    <br><br>

    <p>Select your interests:</p>

    <label>
        <input type="checkbox" name="interest" value="sports">
        Sports
    </label>

    <label>
        <input type="checkbox" name="interest" value="music">
        Music
    </label>

</fieldset>
<fieldset>
    <legend>Other</legend>

    <label for="department">Department:</label>
    <select id="department" name="department">
        <option value="csn">Computer System and Network</option>
        <option value="cybersecurity">Cybersecurity</option>
        <option value="mechanical">Mechanical Engineering</option>
    </select>

    <br><br>

    <label for="remarks">Remarks:</label>
    <textarea id="remarks" name="remarks" rows="4" cols="30"></textarea>

    <br><br>

    <label for="id_card">Upload ID Card:</label>
    <input type="file" id="id_card" name="id_card">

</fieldset>
<br>

<input type="submit" value="Register">
<input type="reset" value="Clear">
</main>
</form>

  <footer>
    <p>&copy; 2026 JNEC Events Hub</p>
  </footer>
</body>
</html>
